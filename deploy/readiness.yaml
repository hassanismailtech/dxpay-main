# Database and readiness service

apiVersion: v1
kind: Service
metadata:
  name: dxpay-postgres
  namespace: team12
spec:
  type: ClusterIP
  selector:
    app: dxpay-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxpay-postgres
  namespace: team12
  labels:
    app: dxpay-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dxpay-postgres
  template:
    metadata:
      labels:
        app: dxpay-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: dxpay-runtime
          env:
            - name: POSTGRES_DB
              value: "dxpay"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
