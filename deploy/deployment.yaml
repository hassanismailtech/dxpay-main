# team12 production deployment manifests

## deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxpay-frontend
  namespace: team12
  labels:
    app: dxpay-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dxpay-frontend
  template:
    metadata:
      labels:
        app: dxpay-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/team12/dxpay-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://dxpay-backend:5000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
