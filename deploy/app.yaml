# Frontend and API production deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxpay-app
  namespace: team12
  labels:
    app: dxpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dxpay
  template:
    metadata:
      labels:
        app: dxpay
    spec:
      containers:
        - name: frontend
          image: ghcr.io/team12/dxpay-main:build-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://dxpay-backend:5000"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: api
          image: ghcr.io/team12/dxpay-main:build-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 5000
          envFrom:
            - secretRef:
                name: dxpay-runtime
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: FRONTEND_URL
              value: "https://team12.xtradot.co"
            - name: PGHOST
              value: "dxpay-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "dxpay"
            - name: PGSSLMODE
              value: "disable"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: dxpay-runtime
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: dxpay-runtime
                  key: PGPASSWORD
            - name: BANK_API_URL
              value: "http://bank-api.ingress-apisix.svc.cluster.local/v1"
            - name: FORGE_MERCHANT_ID
              value: "mer_204"
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: dxpay-app
  namespace: team12
spec:
  type: ClusterIP
  selector:
    app: dxpay
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: api
      port: 5000
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: dxpay-backend
  namespace: team12
spec:
  type: ClusterIP
  selector:
    app: dxpay
  ports:
    - name: api
      port: 5000
      targetPort: api
